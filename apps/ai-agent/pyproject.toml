[project]
name = "financial-vellun-ai-agent"
version = "0.0.1"
description = "Financial Vellun AI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "openai>=1.58.0",
]

[project.optional-dependencies]
# Backend de buffer distribuído (MESSAGE_BUFFER_BACKEND=redis). Instale com
# `pip install -e .[redis]` em produção.
redis = [
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
