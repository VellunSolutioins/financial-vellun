[project]
name = "financial-vellun-ai-agent"
version = "0.0.1"
description = "Financial Vellun AI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "openai>=1.58.0",
    # Estado distribuido: agrupamento por telefone, locks e estado de conversa.
    "redis>=5.0.0",
    # Broker duravel do pipeline WhatsApp (MESSAGE_BROKER=rabbitmq).
    "aio-pika>=9.4.0",
    # Exposicao de metricas em formato Prometheus (/metrics).
    "prometheus-client>=0.21.0",
    # Base IANA de fusos para o `zoneinfo` (services/clock.py). O Windows nao tem
    # uma; sem ela, "hoje em Brasilia" nao e calculavel fora de Linux.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Mantido por compatibilidade: o redis agora e dependencia obrigatoria.
redis = [
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: exige RabbitMQ e Redis reais (rode com `pytest -m integration`)",
]
