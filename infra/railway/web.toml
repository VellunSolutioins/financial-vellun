# Serviço `financial-vellun-web` — Next.js 14 (App Router).
#
# Aponte o campo "Config as code" deste serviço para `infra/railway/web.toml`.
# Só é necessário se o front sair da Vercel para o Railway; enquanto estiver na
# Vercel, este arquivo documenta o que o serviço precisaria.
#
# Variáveis que este serviço PRECISA ter:
#   NEXT_PUBLIC_API_URL       ← URL pública da API (o browser chama daqui)
#   PORT                      ← atribuído pelo Railway; `next start` respeita

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @financial-vellun/web build"

[deploy]
startCommand = "pnpm --filter @financial-vellun/web start"

# O Next serve a raiz sem depender da API: um health check que chamasse a API
# acoplaria o deploy do front à saúde do back.
healthcheckPath = "/"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

numReplicas = 1

overlapSeconds = 20
