# Testes das regras de alerta do pipeline WhatsApp.
#
#   promtool test rules infra/observability/alerts/tests/*.test.yaml
#
# Cobrem os dois critérios de aceite da Entrega 3 — "derrubar o consumidor dispara
# fila sem consumidor" e "forçar uma mensagem para a DLQ dispara nova entrada em
# DLQ" — de forma **determinística**. Conferir Pending → Firing na UI prova uma
# vez, num navegador; isto prova a cada execução, e pega a regressão de quem
# ajustar um limiar sem perceber o efeito.
#
# Cada caso também verifica o **não disparo**, que é a metade esquecida: um alerta
# que dispara sempre é indistinguível de um alerta quebrado.

rule_files:
  - ../whatsapp-pipeline.yaml

evaluation_interval: 30s

tests:
  # ── Fila com mensagem e sem consumidor ───────────────────────────────────
  - interval: 30s
    name: fila com mensagem e consumidor no ar não alerta
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.v1",vhost="/"}'
        values: '50+10x20'
      - series: 'rabbitmq_detailed_queue_consumers{queue="whatsapp.processing.v1",vhost="/"}'
        values: '3x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FilaComMensagemESemConsumidor
        exp_alerts: []

  - interval: 30s
    name: consumidor cai com mensagem na fila e o alerta dispara
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.v1",vhost="/"}'
        values: '120x20'
      # O worker morre no instante zero: nenhum consumidor a partir daí.
      - series: 'rabbitmq_detailed_queue_consumers{queue="whatsapp.processing.v1",vhost="/"}'
        values: '0x20'
    alert_rule_test:
      # Antes do `for: 2m` ainda não dispara — a tolerância existe para um deploy
      # não acordar ninguém.
      - eval_time: 1m
        alertname: FilaComMensagemESemConsumidor
        exp_alerts: []
      - eval_time: 3m
        alertname: FilaComMensagemESemConsumidor
        exp_alerts:
          - exp_labels:
              severity: critical
              service: ai-agent-worker
              queue: whatsapp.processing.v1
              vhost: /
            exp_annotations:
              summary: 'Fila whatsapp.processing.v1 tem mensagem e nenhum consumidor'
              description: >-
                120 mensagem(ns) pronta(s) em whatsapp.processing.v1 sem nenhum consumidor conectado há mais de 2 minutos. Nada está sendo processado.
              dashboard: 'DASHBOARD_BASE/d/vellun-whatsapp/pipeline-whatsapp'
              runbook: 'RUNBOOK_BASE/whatsapp-messaging-runbook.md#backlog-crescendo'

  - interval: 30s
    name: fila vazia sem consumidor não alerta
    input_series:
      # É o estado normal de madrugada: ninguém mandou mensagem. Alertar aqui seria
      # o caminho mais curto para o alerta ser ignorado.
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.v1",vhost="/"}'
        values: '0x20'
      - series: 'rabbitmq_detailed_queue_consumers{queue="whatsapp.processing.v1",vhost="/"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FilaComMensagemESemConsumidor
        exp_alerts: []

  - interval: 30s
    name: fila de retry sem consumidor não alerta
    input_series:
      # Fila de retry não tem consumidor por construção: o TTL devolve a mensagem
      # à fila principal. Incluí-la geraria alerta permanente.
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.retry.60s",vhost="/"}'
        values: '30x20'
      - series: 'rabbitmq_detailed_queue_consumers{queue="whatsapp.processing.retry.60s",vhost="/"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FilaComMensagemESemConsumidor
        exp_alerts: []

  # ── Nova entrada em DLQ ──────────────────────────────────────────────────
  - interval: 30s
    name: mensagem forçada para a DLQ dispara o alerta
    input_series:
      # Zero por dois minutos, e então uma mensagem entra.
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.dlq",vhost="/"}'
        values: '0x4 1x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: NovaEntradaEmDLQ
        exp_alerts: []
      # Sem `for`: esperar para contar uma mensagem que já falhou definitivamente
      # só atrasaria a investigação.
      - eval_time: 4m
        alertname: NovaEntradaEmDLQ
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ai-agent-worker
              queue: whatsapp.processing.dlq
              vhost: /
            exp_annotations:
              summary: 'Nova mensagem em whatsapp.processing.dlq'
              description: >-
                1 mensagem(ns) entrou(entraram) em whatsapp.processing.dlq nos últimos 5 minutos. Investigue a causa ANTES de reprocessar.
              dashboard: 'DASHBOARD_BASE/d/vellun-whatsapp/pipeline-whatsapp'
              runbook: 'RUNBOOK_BASE/whatsapp-messaging-runbook.md#mensagens-na-dlq'

  - interval: 30s
    name: DLQ vazia e estável não alerta
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.inbound.dlq",vhost="/"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: NovaEntradaEmDLQ
        exp_alerts: []
      - eval_time: 10m
        alertname: DlqAcumulandoSemTratamento
        exp_alerts: []

  - interval: 1m
    name: DLQ com mensagem parada há mais de uma hora alerta
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.inbound.dlq",vhost="/"}'
        values: '2x90'
    alert_rule_test:
      # Uma mensagem na DLQ é incidente; parada por uma hora é incidente ignorado.
      - eval_time: 30m
        alertname: DlqAcumulandoSemTratamento
        exp_alerts: []
      - eval_time: 70m
        alertname: DlqAcumulandoSemTratamento
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ai-agent-worker
              queue: whatsapp.inbound.dlq
              vhost: /
            exp_annotations:
              summary: 'whatsapp.inbound.dlq com mensagem parada há mais de 1 hora'
              description: >-
                2 mensagem(ns) em whatsapp.inbound.dlq sem tratamento há mais de uma hora.
              dashboard: 'DASHBOARD_BASE/d/vellun-whatsapp/pipeline-whatsapp'
              runbook: 'RUNBOOK_BASE/whatsapp-messaging-runbook.md#mensagens-na-dlq'

  # ── Publicação e processamento ───────────────────────────────────────────
  - interval: 30s
    name: falha de publicação no webhook dispara alerta crítico
    input_series:
      - series: 'vellun_agent_publish_failed_total{job="ai-agent"}'
        values: '0x4 1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: WebhookRecusandoPublicacao
        exp_alerts:
          - exp_labels:
              severity: critical
              service: ai-agent
              job: ai-agent
            exp_annotations:
              summary: 'Webhook do WhatsApp não está conseguindo publicar'
              description: >-
                1 falha(s) de publicação nos últimos 5 minutos. O webhook está devolvendo 503 e a Meta vai reenviar — com limite de tentativas.
              dashboard: 'DASHBOARD_BASE/d/vellun-whatsapp/pipeline-whatsapp'
              runbook: 'RUNBOOK_BASE/whatsapp-messaging-runbook.md#webhook-devolvendo-503'

  - interval: 30s
    name: proporcao baixa de erro de processamento não alerta
    input_series:
      # 10 erros em 10.000 jobs é ruído; alertar por contagem absoluta confundiria
      # isto com um incidente.
      - series: 'vellun_agent_processing_error_total'
        values: '0+0.01x40'
      - series: 'vellun_agent_jobs_processed_total'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: TaxaDeErroDeProcessamentoAlta
        exp_alerts: []

  - interval: 30s
    name: proporcao alta de erro de processamento alerta
    input_series:
      # 3 de cada 10 jobs falhando.
      - series: 'vellun_agent_processing_error_total'
        values: '0+3x60'
      - series: 'vellun_agent_jobs_processed_total'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: TaxaDeErroDeProcessamentoAlta
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ai-agent-worker
            exp_annotations:
              summary: 'Mais de 10% dos jobs falhando no processamento'
              description: >-
                30% dos jobs processados nos últimos 10 minutos terminaram em erro.
              dashboard: 'DASHBOARD_BASE/d/vellun-whatsapp/pipeline-whatsapp'
              runbook: 'RUNBOOK_BASE/whatsapp-messaging-runbook.md#mensagens-na-dlq'

  - interval: 30s
    name: sem trafego nenhum não alerta por divisao por zero
    input_series:
      # A madrugada: nenhum job processado, nenhum erro. O denominador `> 0` na
      # regra é o que evita um alerta permanente aqui.
      - series: 'vellun_agent_processing_error_total'
        values: '0x40'
      - series: 'vellun_agent_jobs_processed_total'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: TaxaDeErroDeProcessamentoAlta
        exp_alerts: []

  # ── Catálogo de falhas (Entrega 5) ───────────────────────────────────────
  - interval: 30s
    name: catalogo ausente mantem a regra inerte
    input_series:
      # Antes da Entrega 5 a métrica do catálogo não existe. Sem o `unless
      # absent(...)` a subtração viraria "DLQ menos nada" e alertaria em falso.
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.dlq",vhost="/"}'
        values: '20x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: CatalogoDeFalhasDivergindoDaDLQ
        exp_alerts: []

  - interval: 30s
    name: catalogo atras da DLQ alerta
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.dlq",vhost="/"}'
        values: '20x40'
      # O consumer do catálogo parou: registrou 2 das 20.
      - series: 'vellun_ops_failed_messages_captured_total'
        values: '2x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: CatalogoDeFalhasDivergindoDaDLQ
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ai-agent-worker
            exp_annotations:
              summary: 'Catálogo de falhas atrás da DLQ'
              description: >-
                A DLQ tem 18 mensagem(ns) além do que o catálogo registrou. O consumer do catálogo pode estar parado — o painel de operações está mostrando menos falhas do que existem.
              dashboard: 'DASHBOARD_BASE/d/vellun-whatsapp/pipeline-whatsapp'
              runbook: 'RUNBOOK_BASE/whatsapp-messaging-runbook.md#mensagens-na-dlq'

  - interval: 30s
    name: catalogo acompanhando a DLQ não alerta
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="whatsapp.processing.dlq",vhost="/"}'
        values: '20x40'
      - series: 'vellun_ops_failed_messages_captured_total'
        values: '20x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: CatalogoDeFalhasDivergindoDaDLQ
        exp_alerts: []
